services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    env_file:
      - .env
    environment:
      API_PORT: ${API_PORT:-4000}
      CHOKIDAR_INTERVAL: 500
      CHOKIDAR_USEPOLLING: "true"
      NODE_ENV: development
    ports:
      - "${API_PORT:-4000}:${API_PORT:-4000}"
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/api
          target: /workspace/apps/api
          initial_sync: true
          ignore:
            - node_modules/
            - dist/
            - package.json
        - action: sync
          path: ./data
          target: /workspace/data
          initial_sync: true
        - action: rebuild
          path: ./apps/api/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: sync+restart
          path: ./tsconfig.base.json
          target: /workspace/tsconfig.base.json

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      CHOKIDAR_INTERVAL: 500
      CHOKIDAR_USEPOLLING: "true"
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: ${API_ORIGIN:-http://localhost:4000}
      NODE_ENV: development
      PORT: 3000
      WATCHPACK_POLLING: "true"
    ports:
      - "3000:3000"
    restart: unless-stopped
    develop:
      watch:
        - action: sync
          path: ./apps/web
          target: /workspace/apps/web
          initial_sync: true
          ignore:
            - node_modules/
            - .next/
            - package.json
        - action: rebuild
          path: ./apps/web/package.json
        - action: rebuild
          path: ./package.json
        - action: rebuild
          path: ./pnpm-lock.yaml
        - action: sync+restart
          path: ./tsconfig.base.json
          target: /workspace/tsconfig.base.json
