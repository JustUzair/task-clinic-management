services:
  postgres-test:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: clinic_test
      POSTGRES_PASSWORD: clinic_test
      POSTGRES_USER: clinic_test
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clinic_test -d clinic_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    ports:
      - "55432:5432"
    tmpfs:
      - /var/lib/postgresql/data
